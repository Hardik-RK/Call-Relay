<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Dial</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #14181f; --muted: #5d6675; --line: #dfe3ea;
    --accent: #0b6b57; --accent-ink: #ffffff; --accent-soft: #e2f3ee;
    --queued: #8a5a00; --queued-bg: #fff2d6;
    --sent: #1a4fa0; --sent-bg: #e1ebfb;
    --dialing: #0b6b57; --dialing-bg: #dff3ea;
    --failed: #a4262c; --failed-bg: #fde4e4;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #181c22; --ink: #eef1f5; --muted: #98a2b3; --line: #2a303a;
      --accent: #3ecfa6; --accent-ink: #04281f; --accent-soft: #14312b;
      --queued: #f2c35c; --queued-bg: #3a2f12;
      --sent: #8db8ff; --sent-bg: #16294a;
      --dialing: #5fe0b8; --dialing-bg: #123a2e;
      --failed: #ff9a9f; --failed-bg: #421a1d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 0.92rem; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; margin-bottom: 16px;
  }
  h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
  .row { display: flex; gap: 10px; }
  input[type=text], input[type=password], select {
    width: 100%; font: inherit; font-size: 1.15rem; padding: 12px 14px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px; padding: 12px 20px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.small { padding: 6px 12px; font-size: 0.85rem; font-weight: 500; }
  .hint { min-height: 1.5em; margin: 8px 0 0; font-size: 0.9rem; color: var(--muted); }
  .hint.err { color: var(--failed); }
  .hint.ok { color: var(--dialing); }
  ul { list-style: none; margin: 0; padding: 0; }
  li.item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  li.item:first-child { border-top: 0; padding-top: 0; }
  .num { font-variant-numeric: tabular-nums; font-weight: 600; }
  .meta { color: var(--muted); font-size: 0.82rem; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
  .badge.queued { color: var(--queued); background: var(--queued-bg); }
  .badge.sent_to_phone { color: var(--sent); background: var(--sent-bg); }
  .badge.dialing { color: var(--dialing); background: var(--dialing-bg); }
  .badge.failed { color: var(--failed); background: var(--failed-bg); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-right: 8px; }
  .dot.on { background: var(--dialing); }
  .code { font: 700 2rem/1.2 ui-monospace, "Cascadia Mono", Menlo, monospace; letter-spacing: 0.12em; text-align: center; padding: 14px; background: var(--accent-soft); border-radius: 10px; margin: 12px 0 6px; user-select: all; }
  .empty { color: var(--muted); font-size: 0.92rem; margin: 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Quick Dial</h1>
  <p class="sub">Type a number here. Your paired phone asks you to confirm, then dials it.</p>

  <section class="card hidden" id="keyCard">
    <h2>Access key</h2>
    <label for="key">This server needs its access key</label>
    <div class="row">
      <input id="key" type="password" autocomplete="off" spellcheck="false">
      <button class="primary" id="keyBtn" type="button">Unlock</button>
    </div>
    <p class="hint err" id="keyErr"></p>
  </section>

  <section class="card" id="dialCard">
    <h2>Call</h2>
    <form id="dialForm" novalidate>
      <label for="number">Phone number</label>
      <div class="row">
        <input id="number" type="text" inputmode="tel" autocomplete="off" placeholder="e.g. 91234 56789" aria-describedby="hint">
        <button class="primary" id="callBtn" type="submit">Call</button>
      </div>
      <div id="deviceRow" class="hidden" style="margin-top:10px">
        <label for="device">From phone</label>
        <select id="device"></select>
      </div>
      <p class="hint" id="hint" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section class="card">
    <h2>Phones</h2>
    <ul id="devices"></ul>
    <p class="empty" id="noDevices">No phone paired yet.</p>
    <div style="margin-top:12px">
      <button type="button" id="pairBtn">Pair a phone</button>
    </div>
    <div id="pairBox" class="hidden">
      <div class="code" id="code" aria-live="polite"></div>
      <p class="meta" id="codeMeta"></p>
      <p class="meta">On the phone: open Quick Dial, enter this server address and this code. The code works once and expires in 10 minutes.</p>
    </div>
  </section>

  <section class="card">
    <h2>Recent calls</h2>
    <ul id="calls"></ul>
    <p class="empty" id="noCalls">Nothing yet.</p>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const STATE_LABEL = { queued: 'Queued', sent_to_phone: 'Sent to phone', dialing: 'Dialing', failed: 'Failed' };
  let accessKey = '';
  try { accessKey = sessionStorage.getItem('qd-key') || ''; } catch { /* storage unavailable */ }
  let pairExpires = 0;
  let timer = null;
  let previewTimer = null;
  let previewSeq = 0;
  let lastDeviceCount = -1;

  async function api(path, opts = {}) {
    const headers = { ...(opts.headers || {}) };
    if (opts.body !== undefined) headers['content-type'] = 'application/json';
    if (accessKey) headers['x-access-key'] = accessKey;
    const res = await fetch(path, { ...opts, headers, body: opts.body === undefined ? undefined : JSON.stringify(opts.body) });
    let data = null;
    try { data = await res.json(); } catch { /* empty body */ }
    return { status: res.status, data };
  }

  function setHint(text, kind) {
    const h = $('hint');
    h.textContent = text;
    h.className = 'hint' + (kind ? ' ' + kind : '');
  }

  function timeAgo(ms) {
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 5) return 'just now';
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s / 60) + ' min ago';
    return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function li(children) {
    const el = document.createElement('li');
    el.className = 'item';
    children.forEach((c) => el.appendChild(c));
    return el;
  }
  function span(text, cls) {
    const el = document.createElement('span');
    el.textContent = text;
    if (cls) el.className = cls;
    return el;
  }

  function render(state) {
    $('keyCard').classList.add('hidden');
    if (lastDeviceCount >= 0 && state.devices.length > lastDeviceCount) {
      clearInterval(timer);
      $('pairBox').classList.add('hidden');
    }
    lastDeviceCount = state.devices.length;

    const devices = $('devices');
    devices.replaceChildren();
    for (const d of state.devices) {
      const left = document.createElement('div');
      const top = document.createElement('div');
      top.append(span('', 'dot' + (d.online ? ' on' : '')), span(d.name, 'num'));
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = d.online ? 'Online' : 'Last seen ' + timeAgo(d.lastSeenAt);
      left.append(top, meta);
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'small'; btn.textContent = 'Unpair';
      btn.addEventListener('click', async () => {
        if (!confirm('Unpair ' + d.name + '?')) return;
        await api('/api/devices/' + encodeURIComponent(d.id), { method: 'DELETE' });
        refresh();
      });
      devices.appendChild(li([left, btn]));
    }
    $('noDevices').classList.toggle('hidden', state.devices.length > 0);

    const sel = $('device');
    const prev = sel.value;
    sel.replaceChildren();
    for (const d of state.devices) {
      const o = document.createElement('option');
      o.value = d.id; o.textContent = d.name + (d.online ? '' : ' (offline)');
      sel.appendChild(o);
    }
    if ([...sel.options].some((o) => o.value === prev)) sel.value = prev;
    $('deviceRow').classList.toggle('hidden', state.devices.length < 2);

    const calls = $('calls');
    calls.replaceChildren();
    for (const c of state.calls) {
      const left = document.createElement('div');
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = timeAgo(c.createdAt) + (c.reason ? ' · ' + c.reason : '');
      left.append(span(c.display, 'num'), meta);
      calls.appendChild(li([left, span(STATE_LABEL[c.state] || c.state, 'badge ' + c.state)]));
    }
    $('noCalls').classList.toggle('hidden', state.calls.length > 0);
  }

  async function refresh() {
    try {
      const { status, data } = await api('/api/state');
      if (status === 401) { $('keyCard').classList.remove('hidden'); return; }
      if (status === 200) render(data);
    } catch { /* server briefly unreachable: keep the last view */ }
  }

  $('keyBtn').addEventListener('click', async () => {
    accessKey = $('key').value;
    const { status } = await api('/api/state');
    if (status === 200) {
      try { sessionStorage.setItem('qd-key', accessKey); } catch { /* ignore */ }
      $('keyErr').textContent = '';
      refresh();
    } else {
      $('keyErr').textContent = status === 429 ? 'Too many attempts. Wait a minute.' : 'That key was not accepted.';
    }
  });

  $('number').addEventListener('input', () => {
    clearTimeout(previewTimer);
    const value = $('number').value;
    if (!value.trim()) { setHint(''); return; }
    const seq = ++previewSeq;
    previewTimer = setTimeout(async () => {
      const { data } = await api('/api/normalize?number=' + encodeURIComponent(value));
      if (seq !== previewSeq || !data) return;
      if (data.ok) setHint('Will dial ' + data.display, 'ok');
      else setHint(data.message || 'Not a valid number.', 'err');
    }, 200);
  });

  $('dialForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('callBtn');
    btn.disabled = true;
    try {
      const body = { number: $('number').value };
      if (!$('deviceRow').classList.contains('hidden')) body.deviceId = $('device').value;
      const { status, data } = await api('/api/calls', { method: 'POST', body });
      if (status === 201) {
        previewSeq++;
        setHint('Queued ' + data.display + '. Waiting for your phone.', 'ok');
        $('number').value = '';
      } else if (status === 429) {
        setHint('Slow down: try again in ' + (data.retryAfter || 'a few') + ' seconds.', 'err');
      } else {
        setHint((data && data.message) || 'Could not place the call.', 'err');
      }
    } catch {
      setHint('Server unreachable.', 'err');
    } finally {
      btn.disabled = false;
      refresh();
    }
  });

  $('pairBtn').addEventListener('click', async () => {
    const { status, data } = await api('/api/pairing-code', { method: 'POST', body: {} });
    if (status !== 201) {
      $('code').textContent = '';
      $('codeMeta').textContent = status === 429 ? 'Too many codes requested. Wait a minute.' : 'Could not create a code.';
      $('pairBox').classList.remove('hidden');
      return;
    }
    $('code').textContent = data.code;
    pairExpires = data.expiresAt;
    $('pairBox').classList.remove('hidden');
    tickCode();
  });

  function tickCode() {
    clearInterval(timer);
    const update = () => {
      const left = Math.round((pairExpires - Date.now()) / 1000);
      if (left <= 0) {
        $('pairBox').classList.add('hidden');
        clearInterval(timer);
        return;
      }
      $('codeMeta').textContent = 'Expires in ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    };
    update();
    timer = setInterval(update, 1000);
  }

  refresh();
  setInterval(refresh, 2000);
})();
</script>
</body>
</html>
