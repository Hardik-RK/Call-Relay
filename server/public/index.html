<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Quick Dial</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="m13 10 4 4M17 10l-4 4"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>

<a class="skip-link" href="#number">Skip to the number field</a>

<div class="app">
  <div class="frame">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-phone"/></svg></span>
        <span class="brand-name">Quick Dial</span>
      </div>
      <div class="tb-meta">
        <span class="status-line" id="conn" role="status" aria-live="polite" data-state="connecting"><span class="led" aria-hidden="true"></span><span id="connText">Connecting…</span></span>
        <span class="tb-phones" id="phoneSummary"></span>
      </div>
      <button class="btn btn-icon btn-bare theme-toggle" id="themeBtn" type="button" aria-label="Switch theme" title="Switch theme (Alt T)">
        <svg class="icon icon-moon" aria-hidden="true"><use href="#i-moon"/></svg>
        <svg class="icon icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
      </button>
    </header>

    <main class="grid is-loading" id="main">
      <section class="col-call" aria-labelledby="callTitle">
        <div class="sec-head"><h1 class="sec-title" id="callTitle">Call</h1><span class="sec-lead" aria-hidden="true"></span></div>

        <form id="dialForm" novalidate autocomplete="off">
          <div class="seg" id="modeSeg" role="radiogroup" aria-label="Dial mode" data-value="number">
            <span class="seg-ind" aria-hidden="true"></span>
            <button type="button" role="radio" aria-checked="true" data-mode="number" tabindex="0">Number</button>
            <button type="button" role="radio" aria-checked="false" data-mode="raw" tabindex="-1">Exactly as typed</button>
          </div>

          <label class="sr-only" for="number">Phone number</label>
          <div class="display texture" id="display">
            <input id="number" class="led-num" type="text" inputmode="tel" enterkeyhint="go" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="32" placeholder="Enter a number" aria-describedby="preview">
            <button class="btn btn-icon btn-bare" id="backBtn" type="button" aria-label="Delete last character" title="Backspace"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
          </div>

          <div class="preview" id="preview" role="status" aria-live="polite" data-kind="">
            <span class="pv-label"></span><span class="pv-value"></span>
          </div>

          <div class="field-row" id="deviceRow" hidden>
            <label for="device">From phone</label>
            <span class="sel"><select class="select" id="device"></select></span>
          </div>

          <button class="btn btn-primary btn-lg" id="callBtn" type="submit" disabled>
            <span class="spin" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="btn-label" id="callLabel">Call</span>
            <kbd aria-hidden="true">Enter</kbd>
          </button>
          <p class="call-note" id="callNote" aria-live="polite"></p>
        </form>
      </section>

      <div class="col-side">
        <section class="section" aria-labelledby="phonesTitle">
          <div class="sec-head"><h2 class="sec-title" id="phonesTitle">Phones</h2><span class="sec-lead" aria-hidden="true"></span>
            <button class="btn" id="pairBtn" type="button" title="Pair a phone (Alt P)"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span id="pairLabel">Pair a phone</span></button>
          </div>
          <ul class="rows" id="devices"></ul>
          <div id="noDevices" class="empty-slot" hidden></div>

          <div class="pair" id="pairBox" hidden>
            <div class="pair-top">
              <span class="eyebrow">Pairing code</span>
              <span class="meta tnum" id="codeMeta"></span>
            </div>
            <div class="code-row">
              <div class="code" id="code" aria-label="Pairing code"></div>
              <button class="btn" id="copyBtn" type="button"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg><span id="copyLabel">Copy</span></button>
            </div>
            <span class="track" id="codeTrack" role="img" aria-label="Time left on the code"><i class="lit"></i><i class="rest"></i></span>
            <ol class="steps">
              <li>On the phone, open Quick Dial.</li>
              <li>Enter this server address: <span class="mono addr" id="addr"></span></li>
              <li>Enter the code above. It works once.</li>
            </ol>
            <button class="btn btn-bare" id="pairClose" type="button">Done</button>
          </div>
        </section>

        <section class="section" aria-labelledby="callsTitle">
          <div class="sec-head"><h2 class="sec-title" id="callsTitle">Recent calls</h2><span class="sec-lead" aria-hidden="true"></span></div>
          <ul class="rows" id="calls"></ul>
          <div id="noCalls" class="empty-slot" hidden></div>
        </section>
      </div>
    </main>

    <div id="unauth" class="unauth" hidden></div>

    <footer class="keys" id="keys">
      <span><kbd>0</kbd>–<kbd>9</kbd> type</span>
      <span><kbd>Enter</kbd> call</span>
      <span><kbd>Esc</kbd> clear</span>
      <span><kbd>Alt</kbd><kbd>P</kbd> pair</span>
      <span><kbd>Alt</kbd><kbd>M</kbd> mode</span>
      <span><kbd>Alt</kbd><kbd>T</kbd> theme</span>
    </footer>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
